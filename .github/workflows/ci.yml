name: CI

on:
  push:
    branches: [main-UI]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore UniSlot.slnx
      - name: Build
        run: dotnet build UniSlot.slnx -c Release --no-restore
      - name: Test
        run: dotnet test UniSlot.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Publish CLI (smoke)
        if: matrix.os != 'ubuntu-latest'
        run: dotnet publish src/UniSlot.Cli -c Release -r ${{ matrix.os == 'windows-latest' && 'win-x64' || 'osx-arm64' }} --self-contained true -o publish
